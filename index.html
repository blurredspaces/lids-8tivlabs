<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>8tivlabs LIDS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --screen: #140d05;      /* unlit CRT glass */
      --phosphor: #ffb23e;    /* amber phosphor */
      --phosphor-dim: #a86a1c;
      --glow: rgba(255, 160, 40, 0.45);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background:
        radial-gradient(ellipse at center, #22160a 0%, var(--screen) 65%, #080502 100%);
      color: var(--phosphor);
      font-family: "VT323", "Courier New", monospace;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 16px;
    }

    /* scanlines */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0.28) 3px
      );
    }

    main {
      text-align: center;
      text-shadow: 0 0 6px var(--glow), 0 0 22px var(--glow);
    }

    .org {
      font-size: clamp(1.125rem, 3vw, 1.5rem);
      color: var(--phosphor-dim);
      letter-spacing: 0.06em;
      line-height: 1;
    }

    h1 {
      font-weight: 400;
      font-size: clamp(3rem, 11vw, 5.5rem);
      line-height: 0.85;
      letter-spacing: 0.04em;
      position: relative;
    }

    /* sits outside the flow so LIDS itself stays optically centered */
    .cursor {
      position: absolute;
      left: 100%;
      bottom: 0.14em;
      width: 0.38em;
      height: 0.6em;
      margin-left: 0.04em;
      background: var(--phosphor);
      box-shadow: 0 0 14px var(--glow);
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="org">8tivlabs</p>
    <h1>LIDS<span class="cursor" aria-hidden="true"></span></h1>
  </main>
</body>
</html>
