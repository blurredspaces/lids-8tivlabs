<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>8tivlabs LIDS</title>
  <meta name="description" content="The Handoff, a Fits From The Streets x Lids brand campaign by 8tivLabs.">
  <!-- link previews (iMessage, Slack, LinkedIn, X). Crawlers need an absolute image URL. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="LIDS: The Handoff">
  <meta property="og:description" content="A Fits From The Streets x Lids brand campaign by 8tivLabs.">
  <meta property="og:image" content="/img/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Episode 1 subject in a black White Sox cap beside the LIDS wordmark">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      --paper: #ffffff;
      --ink: #000000;
      --ink-dim: #6b6b6b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      /* Mac OS X Aqua-era system type: Lucida Grande on Macs, Lucida Sans Unicode on Windows */
      font-family: "Lucida Grande", "Lucida Sans Unicode", "Lucida Sans", Geneva, Verdana, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 16px;
    }

    main { text-align: center; }

    .logo {
      display: block;
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
    }

    h1 {
      font-weight: 700;
      font-size: clamp(2.5rem, 8vw, 3.75rem);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .terminal {
      margin-top: 1.5em;
      font-size: clamp(0.9375rem, 2.4vw, 1.125rem);
      line-height: 1.7;
      min-height: 5.6em;
      cursor: text;
      position: relative;
    }

    .terminal p { white-space: pre-wrap; overflow-wrap: anywhere; }

    /*
      The real input covers the whole prompt with transparent text, so a tap lands
      on it directly and phones open the keyboard (they ignore autofocus and won't
      open one for a 1px field). What you type is echoed in .typed.
    */
    .terminal input {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: transparent;
      -webkit-text-fill-color: transparent;
      caret-color: transparent;
      -webkit-appearance: none;
      appearance: none;
      font-size: 16px; /* stops iOS zooming on focus */
      cursor: text;
    }
    .terminal input::selection { background: transparent; }

    .hint { display: none; margin-top: 8px; font-size: 0.8125rem; color: var(--ink-dim); }
    @media (pointer: coarse) {
      .terminal:not(:focus-within) .hint:not([hidden]) { display: block; }
    }

    .cursor {
      display: inline-block;
      width: 1.5px;
      height: 1.15em;
      margin-left: 1px;
      vertical-align: -0.2em;
      background: var(--ink);
      animation: blink 1.1s steps(1) infinite;
    }

    .terminal:not(:focus-within) .prompt-line .cursor { animation: none; opacity: 0.3; }


    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="img/8tivlabs-logo.jpg" alt="8tivLabs" width="48" height="48">
    <h1>LIDS</h1>

    <form class="terminal" id="term" autocomplete="off">
      <div id="log" aria-live="polite"></div>
      <label class="prompt-line" id="prompt-line" for="field">
        <p><span id="prompt">Your name?</span> <span class="typed" id="typed"></span><span class="cursor" aria-hidden="true"></span></p>
      </label>
      <p class="hint" id="hint" aria-hidden="true">Tap to type</p>
      <input id="field" name="name" type="text" maxlength="40" spellcheck="false" autocapitalize="words" autocomplete="off" enterkeyhint="next" autofocus>
    </form>
  </main>

  <script>
    const form = document.getElementById('term');
    const input = document.getElementById('field');
    const log = document.getElementById('log');
    const promptLine = document.getElementById('prompt-line');
    const promptText = document.getElementById('prompt');
    const typed = document.getElementById('typed');
    const hint = document.getElementById('hint');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const PROMPTS = { name: 'Your name?', password: 'Password?' };
    let step = 'name';
    let name = '';
    let busy = false;

    const mask = (value) => '•'.repeat(value.length);
    const echo = () => { typed.textContent = step === 'password' ? mask(input.value) : input.value; };

    form.addEventListener('click', () => { if (!busy) input.focus(); });
    input.addEventListener('input', echo);

    function ask(nextStep) {
      step = nextStep;
      promptText.textContent = PROMPTS[step];
      input.type = step === 'password' ? 'password' : 'text';
      input.maxLength = step === 'password' ? 128 : 40;
      input.autocomplete = step === 'password' ? 'current-password' : 'off';
      input.enterKeyHint = step === 'password' ? 'go' : 'next';
      input.value = '';
      echo();
      promptLine.hidden = false;
      // the field never loses focus between steps, so a phone keyboard stays open
      input.readOnly = false;
      busy = false;
      input.focus({ preventScroll: true });
    }

    function addLine(text) {
      const p = document.createElement('p');
      p.textContent = text;
      log.append(p);
      return p;
    }

    // type a line out one character at a time, like an old terminal
    function typeOut(message, done) {
      if (reduceMotion) { addLine(message); return done(); }
      const line = addLine('');
      const text = document.createTextNode('');
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      cursor.setAttribute('aria-hidden', 'true');
      line.append(text, cursor);
      let i = 0;
      const tick = () => {
        text.data = message.slice(0, ++i);
        if (i < message.length) return setTimeout(tick, 38);
        cursor.remove();
        done();
      };
      setTimeout(tick, 350);
    }

    // give people a beat to read the reply, then open the one-sheet
    const openOneSheet = () => setTimeout(() => { location.href = 'onesheet.html'; }, 2000);

    async function checkPassword(password) {
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        if (res.ok) return 'ok';
        return res.status === 401 ? 'wrong' : 'error';
      } catch {
        return 'error';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const value = input.value;
      if (busy || !value.trim()) return;

      busy = true;
      input.readOnly = true; // readOnly keeps focus; disabled would close the keyboard
      promptLine.hidden = true;

      if (step === 'name') {
        name = value.trim();
        addLine(`${PROMPTS.name} ${name}`);
        return ask('password');
      }

      addLine(`${PROMPTS.password} ${mask(value)}`);
      input.value = '';
      const result = await checkPassword(value);

      if (result === 'ok') {
        hint.hidden = true;
        input.blur();
        typeOut(`Thank you, ${name}. Here is the latest on the LIDS campaign.`, openOneSheet);
      } else if (result === 'wrong') {
        typeOut('Wrong password. Try again.', () => ask('password'));
      } else {
        typeOut("Can't check the password right now. Try again in a moment.", () => ask('password'));
      }
    });
  </script>
</body>
</html>
