<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>8tivlabs LIDS</title>
  <meta name="description" content="The Handoff, a Fits From The Streets x Lids brand campaign by 8tivLabs.">
  <!-- link previews (iMessage, Slack, LinkedIn, X). Crawlers need an absolute image URL. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="LIDS: The Handoff">
  <meta property="og:description" content="A Fits From The Streets x Lids brand campaign by 8tivLabs.">
  <meta property="og:image" content="/img/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Episode 1 subject in a black White Sox cap beside the LIDS wordmark">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      --paper: #ffffff;
      --ink: #000000;
      --ink-dim: #6b6b6b;
      --field-line: #b9b9b9;
      --error: #b3001b;
      --ease-spring: cubic-bezier(0.22, 1.2, 0.36, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      /* Mac OS X Aqua-era system type: Lucida Grande on Macs, Lucida Sans Unicode on Windows */
      font-family: "Lucida Grande", "Lucida Sans Unicode", "Lucida Sans", Geneva, Verdana, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }

    main { width: 100%; max-width: 340px; text-align: center; }

    .logo { display: block; width: 48px; height: 48px; margin: 0 auto 16px; }

    h1 {
      font-weight: 700;
      font-size: clamp(2.5rem, 8vw, 3.75rem);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    /* what has been entered so far, printed like a terminal */
    .log {
      margin-top: 24px;
      font-size: 1rem;
      line-height: 1.7;
    }
    .log p { overflow-wrap: anywhere; }
    .log .dim { color: var(--ink-dim); }

    /* ---------- the form ---------- */
    form { margin-top: 24px; text-align: left; }

    .step { font-size: 0.75rem; color: var(--ink-dim); margin-bottom: 6px; }

    label { display: block; font-size: 1rem; font-weight: 700; margin-bottom: 8px; }

    .field { position: relative; }

    input {
      display: block;
      width: 100%;
      height: 52px;
      padding: 0 14px;
      border: 1px solid var(--field-line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 17px; /* 16px+ stops iOS zooming on focus */
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.12);
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    input::placeholder { color: #a3a3a3; }
    input:hover { border-color: #8a8a8a; }
    input:focus { outline: none; border-color: var(--ink); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.12), 0 0 0 3px rgba(0, 0, 0, 0.12); }
    input[aria-invalid="true"] { border-color: var(--error); box-shadow: 0 0 0 3px rgba(179, 0, 27, 0.14); }
    .field.has-toggle input { padding-right: 72px; }
    input[type="password"]:not(:placeholder-shown) { letter-spacing: 0.1em; }

    .toggle {
      position: absolute;
      top: 6px;
      right: 6px;
      height: 40px;
      padding: 0 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 0.875rem;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }
    .toggle:hover { background: #f1f1f1; text-decoration: none; }
    .toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
    .toggle:active { background: #e6e6e6; }

    .error { min-height: 1.4em; margin-top: 8px; font-size: 0.875rem; color: var(--error); }

    .submit {
      display: block;
      width: 100%;
      height: 52px;
      margin-top: 8px;
      border: 0;
      border-radius: 8px;
      background: var(--ink);
      color: var(--paper);
      font: inherit;
      font-size: 1.0625rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 250ms var(--ease-spring), opacity 150ms ease;
    }
    .submit:hover { transform: translateY(-1px); }
    .submit:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .submit:active { transform: translateY(1px); opacity: 0.85; }
    .submit:disabled { opacity: 0.55; cursor: default; transform: none; }

    .reply { margin-top: 24px; font-size: 1rem; line-height: 1.7; min-height: 1.7em; }

    .cursor {
      display: inline-block;
      width: 1.5px;
      height: 1.15em;
      margin-left: 1px;
      vertical-align: -0.2em;
      background: var(--ink);
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
      input, .submit { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="img/8tivlabs-logo.jpg" alt="8tivLabs" width="48" height="48">
    <h1>LIDS</h1>

    <div class="log" id="log" aria-live="polite"></div>

    <form id="signin" novalidate>
      <p class="step" id="step">Step 1 of 2</p>
      <label for="field" id="label">Your name</label>
      <div class="field">
        <input id="field" name="name" type="text" maxlength="40" placeholder="Type your name"
               autocomplete="name" autocapitalize="words" spellcheck="false" enterkeyhint="next"
               aria-describedby="error" autofocus>
        <button class="toggle" id="toggle" type="button" hidden aria-controls="field">Show</button>
      </div>
      <p class="error" id="error" role="alert"></p>
      <button class="submit" id="submit" type="submit">Next</button>
    </form>

    <p class="reply" id="reply" aria-live="polite" hidden></p>
  </main>

  <script>
    const form = document.getElementById('signin');
    const input = document.getElementById('field');
    const label = document.getElementById('label');
    const stepText = document.getElementById('step');
    const toggle = document.getElementById('toggle');
    const error = document.getElementById('error');
    const submit = document.getElementById('submit');
    const log = document.getElementById('log');
    const reply = document.getElementById('reply');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const STEPS = {
      name: { n: 1, label: 'Your name', placeholder: 'Type your name', button: 'Next', type: 'text', max: 40, auto: 'name', enter: 'next' },
      password: { n: 2, label: 'Password', placeholder: 'Type the password', button: 'Sign in', type: 'password', max: 128, auto: 'current-password', enter: 'go' },
    };
    let step = 'name';
    let name = '';
    let busy = false;

    function showStep(key) {
      const s = STEPS[key];
      step = key;
      stepText.textContent = `Step ${s.n} of 2`;
      label.textContent = s.label;
      input.type = s.type;
      input.name = key;
      input.placeholder = s.placeholder;
      input.maxLength = s.max;
      input.autocomplete = s.auto;
      input.enterKeyHint = s.enter;
      input.autocapitalize = key === 'name' ? 'words' : 'off';
      input.value = '';
      submit.textContent = s.button;
      toggle.hidden = key !== 'password';
      toggle.parentElement.classList.toggle('has-toggle', !toggle.hidden);
      toggle.textContent = 'Show';
      // the same field stays focused between steps, so a phone keyboard stays open
      input.focus({ preventScroll: true });
    }

    function setError(message) {
      error.textContent = message;
      if (message) input.setAttribute('aria-invalid', 'true');
      else input.removeAttribute('aria-invalid');
    }

    function setBusy(on, text) {
      busy = on;
      input.readOnly = on; // readOnly keeps focus; disabled would close the keyboard
      submit.disabled = on;
      if (text) submit.textContent = text;
    }

    function addLine(text, dim) {
      const p = document.createElement('p');
      p.textContent = text;
      if (dim) p.className = 'dim';
      log.append(p);
    }

    // type the reply out one character at a time, like an old terminal
    function typeOut(message, done) {
      reply.hidden = false;
      if (reduceMotion) { reply.textContent = message; return done(); }
      const text = document.createTextNode('');
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      cursor.setAttribute('aria-hidden', 'true');
      reply.append(text, cursor);
      let i = 0;
      const tick = () => {
        text.data = message.slice(0, ++i);
        if (i < message.length) return setTimeout(tick, 38);
        cursor.remove();
        done();
      };
      setTimeout(tick, 250);
    }

    async function checkPassword(password) {
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        if (res.ok) return 'ok';
        return res.status === 401 ? 'wrong' : 'error';
      } catch {
        return 'error';
      }
    }

    input.addEventListener('input', () => { if (error.textContent) setError(''); });

    // pressing Next, Sign in or Show shouldn't pull focus off the field,
    // which would close the phone keyboard between steps
    [submit, toggle].forEach((btn) => btn.addEventListener('mousedown', (e) => e.preventDefault()));

    toggle.addEventListener('click', () => {
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      toggle.textContent = showing ? 'Show' : 'Hide';
      toggle.setAttribute('aria-pressed', String(!showing));
      input.focus({ preventScroll: true });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (busy) return;
      const value = input.value;

      if (step === 'name') {
        if (!value.trim()) { setError('Type your name, then tap Next.'); return input.focus(); }
        name = value.trim();
        addLine(`Your name? ${name}`);
        return showStep('password');
      }

      if (!value) { setError('Type the password, then tap Sign in.'); return input.focus(); }
      setBusy(true, 'Checking…');
      const result = await checkPassword(value);
      setBusy(false, STEPS.password.button);

      if (result === 'wrong') {
        input.value = '';
        setError("That password didn't work. Try again.");
        return input.focus({ preventScroll: true });
      }
      if (result === 'error') {
        setError("Couldn't check the password. Try again in a moment.");
        return input.focus({ preventScroll: true });
      }

      addLine(`Password? ${'•'.repeat(value.length)}`);
      form.hidden = true;
      input.blur();
      typeOut(`Thank you, ${name}. Here is the latest on the LIDS campaign.`, () => {
        // give people a beat to read the reply, then open the one-sheet
        setTimeout(() => { location.href = 'onesheet.html'; }, 2000);
      });
    });
  </script>
</body>
</html>
