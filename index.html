<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>8tivlabs LIDS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #ffffff;
      --ink: #000000;
      --ink-dim: #6b6b6b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "VT323", "Courier New", monospace;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 16px;
    }

    main { text-align: center; }

    .org {
      font-size: clamp(1.125rem, 3vw, 1.5rem);
      color: var(--ink-dim);
      letter-spacing: 0.06em;
      line-height: 1;
    }

    h1 {
      font-weight: 400;
      font-size: clamp(3rem, 11vw, 5.5rem);
      line-height: 0.85;
      letter-spacing: 0.04em;
    }

    .terminal {
      margin-top: 1.5em;
      font-size: clamp(1.25rem, 3.5vw, 1.75rem);
      line-height: 1.4;
      min-height: 5.6em;
      cursor: text;
    }

    .terminal p { white-space: pre-wrap; overflow-wrap: anywhere; }

    /* the real input is invisible; what you type is echoed in .typed */
    .terminal input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      border: 0;
      font-size: 16px; /* stops iOS zooming on focus */
    }

    .cursor {
      display: inline-block;
      width: 0.5em;
      height: 0.9em;
      margin-left: 0.05em;
      vertical-align: -0.12em;
      background: var(--ink);
      animation: blink 1.1s steps(1) infinite;
    }

    .terminal:not(:focus-within) .prompt-line .cursor { animation: none; opacity: 0.3; }

    .next {
      display: inline-block;
      margin-top: 0.4em;
      padding: 0 0.3em;
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 0.15em;
      opacity: 0;
      transition: opacity 300ms ease-out;
    }
    .next.is-shown { opacity: 1; }
    .next:hover { background: var(--ink); color: var(--paper); text-decoration: none; }
    .next:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .next:active { opacity: 0.6; }

    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
      .next { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="org">8tivlabs</p>
    <h1>LIDS</h1>

    <form class="terminal" id="term" autocomplete="off">
      <div id="log" aria-live="polite"></div>
      <label class="prompt-line" id="prompt-line" for="field">
        <p><span id="prompt">Your name?</span> <span class="typed" id="typed"></span><span class="cursor" aria-hidden="true"></span></p>
      </label>
      <input id="field" name="name" type="text" maxlength="40" spellcheck="false" autocapitalize="words" autocomplete="off" autofocus>
      <a class="next" id="next" href="onesheet.html" hidden>View the campaign one-sheet</a>
    </form>
  </main>

  <script>
    const form = document.getElementById('term');
    const input = document.getElementById('field');
    const log = document.getElementById('log');
    const promptLine = document.getElementById('prompt-line');
    const promptText = document.getElementById('prompt');
    const typed = document.getElementById('typed');
    const next = document.getElementById('next');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const PROMPTS = { name: 'Your name?', password: 'Password?' };
    let step = 'name';
    let name = '';

    const mask = (value) => '*'.repeat(value.length);
    const echo = () => { typed.textContent = step === 'password' ? mask(input.value) : input.value; };

    form.addEventListener('click', (e) => { if (e.target !== next && !input.disabled) input.focus(); });
    input.addEventListener('input', echo);

    function ask(nextStep) {
      step = nextStep;
      promptText.textContent = PROMPTS[step];
      input.type = step === 'password' ? 'password' : 'text';
      input.maxLength = step === 'password' ? 128 : 40;
      input.autocomplete = step === 'password' ? 'current-password' : 'off';
      input.value = '';
      echo();
      promptLine.hidden = false;
      input.disabled = false;
      input.focus();
    }

    function addLine(text) {
      const p = document.createElement('p');
      p.textContent = text;
      log.append(p);
      return p;
    }

    // type a line out one character at a time, like an old terminal
    function typeOut(message, done) {
      if (reduceMotion) { addLine(message); return done(); }
      const line = addLine('');
      const text = document.createTextNode('');
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      cursor.setAttribute('aria-hidden', 'true');
      line.append(text, cursor);
      let i = 0;
      const tick = () => {
        text.data = message.slice(0, ++i);
        if (i < message.length) return setTimeout(tick, 38);
        cursor.remove();
        done();
      };
      setTimeout(tick, 350);
    }

    function showNext() {
      next.hidden = false;
      requestAnimationFrame(() => next.classList.add('is-shown'));
      next.focus({ preventScroll: true }); // Enter now opens the one-sheet
    }

    async function checkPassword(password) {
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        if (res.ok) return 'ok';
        return res.status === 401 ? 'wrong' : 'error';
      } catch {
        return 'error';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const value = input.value;
      if (!value.trim()) return;

      input.disabled = true;
      promptLine.hidden = true;

      if (step === 'name') {
        name = value.trim();
        addLine(`${PROMPTS.name} ${name}`);
        return ask('password');
      }

      addLine(`${PROMPTS.password} ${mask(value)}`);
      input.value = '';
      const result = await checkPassword(value);

      if (result === 'ok') {
        typeOut(`Thank you, ${name}. Here is the latest on the LIDS campaign.`, showNext);
      } else if (result === 'wrong') {
        typeOut('Wrong password. Try again.', () => ask('password'));
      } else {
        typeOut("Can't check the password right now. Try again in a moment.", () => ask('password'));
      }
    });
  </script>
</body>
</html>
