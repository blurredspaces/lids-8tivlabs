<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>8tivlabs LIDS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #ffffff;
      --ink: #000000;
      --ink-dim: #6b6b6b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "VT323", "Courier New", monospace;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 16px;
    }

    main { text-align: center; }

    .org {
      font-size: clamp(1.125rem, 3vw, 1.5rem);
      color: var(--ink-dim);
      letter-spacing: 0.06em;
      line-height: 1;
    }

    h1 {
      font-weight: 400;
      font-size: clamp(3rem, 11vw, 5.5rem);
      line-height: 0.85;
      letter-spacing: 0.04em;
    }

    .terminal {
      margin-top: 1.5em;
      font-size: clamp(1.25rem, 3.5vw, 1.75rem);
      line-height: 1.4;
      min-height: 4.2em;
      cursor: text;
    }

    .terminal p { white-space: pre-wrap; overflow-wrap: anywhere; }

    /* the real input is invisible; what you type is echoed in .typed */
    .terminal input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      border: 0;
      font-size: 16px; /* stops iOS zooming on focus */
    }

    .cursor {
      display: inline-block;
      width: 0.5em;
      height: 0.9em;
      margin-left: 0.05em;
      vertical-align: -0.12em;
      background: var(--ink);
      animation: blink 1.1s steps(1) infinite;
    }

    .terminal:not(:focus-within) .prompt-line .cursor { animation: none; opacity: 0.3; }

    .next {
      display: inline-block;
      margin-top: 0.4em;
      padding: 0 0.3em;
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 0.15em;
      opacity: 0;
      transition: opacity 300ms ease-out;
    }
    .next.is-shown { opacity: 1; }
    .next:hover { background: var(--ink); color: var(--paper); text-decoration: none; }
    .next:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .next:active { opacity: 0.6; }

    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
      .next { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="org">8tivlabs</p>
    <h1>LIDS</h1>

    <form class="terminal" id="term" autocomplete="off">
      <label class="prompt-line" for="name">
        <p>Your name? <span class="typed" id="typed"></span><span class="cursor" aria-hidden="true"></span></p>
      </label>
      <input id="name" name="name" type="text" maxlength="40" spellcheck="false" autocapitalize="words" autofocus>
      <p id="reply" aria-live="polite"></p>
      <a class="next" id="next" href="onesheet.html" hidden>View the campaign one-sheet</a>
    </form>
  </main>

  <script>
    const form = document.getElementById('term');
    const input = document.getElementById('name');
    const typed = document.getElementById('typed');
    const reply = document.getElementById('reply');
    const next = document.getElementById('next');
    const promptCursor = form.querySelector('.prompt-line .cursor');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    form.addEventListener('click', (e) => { if (e.target !== next) input.focus(); });
    input.addEventListener('input', () => { typed.textContent = input.value; });

    function showNext() {
      next.hidden = false;
      requestAnimationFrame(() => next.classList.add('is-shown'));
      next.focus({ preventScroll: true }); // Enter now opens the one-sheet
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = input.value.trim();
      if (!name) return;

      input.disabled = true;
      promptCursor.remove();

      const message = `Thank you, ${name}. Here is the latest on the LIDS campaign.`;

      if (reduceMotion) {
        reply.textContent = message;
        showNext();
        return;
      }

      // type the reply out one character at a time, like an old terminal
      const text = document.createTextNode('');
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      cursor.setAttribute('aria-hidden', 'true');
      reply.append(text, cursor);
      let i = 0;
      const tick = () => {
        text.data = message.slice(0, ++i);
        if (i < message.length) return setTimeout(tick, 38);
        cursor.remove();
        showNext();
      };
      setTimeout(tick, 350);
    });
  </script>
</body>
</html>
